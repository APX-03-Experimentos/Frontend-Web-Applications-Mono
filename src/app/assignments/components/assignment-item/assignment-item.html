<mat-card class="assignment-card" appearance="raised">
  <div class="card-content">
    <div class="info-section">
      <h2>{{assignment?.title}}</h2>
      <p>{{assignment?.description}}</p>
      <p>Vence el: {{GetFormattedDate()}}</p>
    </div>
    <div class="actions-section">
      <button mat-raised-button [routerLink]="['/assignment',this.assignment?.id]" color="primary"><mat-icon>search</mat-icon> Ver</button>
    </div>
  </div>
</mat-card>
