<mat-card class="assignment-card" appearance="raised">
  <div class="card-content">
    <div class="info-section">
      <h2 class="assignment-title">{{ assignment?.title }}</h2>
      <p class="assignment-description">{{ assignment?.description }}</p>
      <p class="assignment-date">
        {{ "course_page.assignment_due" | translate }} {{ GetFormattedDate() }}
      </p>
    </div>

    <div class="actions-section">
      <button mat-raised-button color="primary" class="btn-primary"
              [routerLink]="['/assignment', assignment?.id]">
        {{ "course_page.assignment_view" | translate }}
      </button>
    </div>
  </div>
</mat-card>
