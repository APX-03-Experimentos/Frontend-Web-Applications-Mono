<div class="page-bg">
  <div class="main card">
    <img ngSrc="/assets/learnhive_logo_transparent.png" alt="Logo LearnHive" height="200" width="200" priority>

    <h2>Bienvenido a LearnHive</h2>
    <h4>Plataforma integral de análisis y gestión educativa.</h4>

    <mat-button-toggle-group name="authType" aria-label="Tipo de Autenticación" value="login" [(ngModel)]="authType">
      <mat-button-toggle value="login">Iniciar Sesión</mat-button-toggle>
      <mat-button-toggle value="register">Registrarse</mat-button-toggle>
    </mat-button-toggle-group>

    @if (authType == "login")
    {
      <app-login-box></app-login-box>
    } @else if (authType == "register") {
      <app-register-box></app-register-box>
    }
  </div>
</div>
<footer class="footer" role="contentinfo" aria-label="LearnHive footer">
  <div class="footer-inner">
    <p class="footer-copy">© 2024 LearnHive. Todos los derechos reservados.</p>

    <nav class="footer-nav" aria-label="Footer links">
      <a class="footer-link complaints-link" routerLink="/complaints" aria-label="Libro de reclamaciones">
        <img ngSrc="/assets/complaints_book.png" alt="Libro de reclamaciones" height="24" width="24" />
      </a>
      <span class="footer-sep" aria-hidden="true"></span>
      <a class="footer-link" routerLink="/saas">Acuerdo SAAS</a>
    </nav>
  </div>
</footer>
